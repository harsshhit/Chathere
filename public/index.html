<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/icon-192.png" type="image/png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ChatHere" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#120d0b" />
  <meta name="description" content="ChatHere - Real-time Messaging Platform" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700&display=swap" />
  <script>
    // Apply the saved theme before React mounts to avoid a flash.
    // Keep in sync with src/theme/colors.js (THEME_STORAGE_KEY, META_THEME_COLORS).
    (function () {
      var theme = "dark";
      try {
        var stored = localStorage.getItem("chathere-theme");
        if (stored === "light" || stored === "dark") theme = stored;
      } catch (e) { }
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#120d0b" : "#f7efe8");
    })();
  </script>
  <style>
    html {
      background: #120d0b;
      color-scheme: dark;
    }

    html[data-theme="light"] {
      background: #f7efe8;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      background: #120d0b;
      color-scheme: dark;
    }

    body {
      margin: 0;
    }
  </style>
  <title>ChatHere</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
