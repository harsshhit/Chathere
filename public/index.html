<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="ChatHere - Real-time Messaging Platform" />
  <script>
    // Apply the saved theme before React mounts to avoid a flash.
    // Keep in sync with src/theme/colors.js (THEME_STORAGE_KEY, META_THEME_COLORS).
    (function () {
      var theme = "light";
      try {
        var stored = localStorage.getItem("chathere-theme");
        if (stored === "light" || stored === "dark") theme = stored;
      } catch (e) { }
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0f0f17" : "#ffffff");
    })();
  </script>
  <style>
    html {
      background: #f8f9fc;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      background: #0f0f17;
      color-scheme: dark;
    }

    body {
      margin: 0;
    }
  </style>
  <title>ChatHere</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
